name: Firebase Auth smoke test

on:
  push:
    paths:
      - '.github/workflows/firebase-auth-smoke.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Signup login delete test
        shell: bash
        run: |
          API_KEY=$(python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r"apiKey:\s*['\"]([^'\"]+)",s)
          if not m: raise SystemExit('api key not found')
          print(m.group(1))
          PY
          )
          API_KEY="$API_KEY" node <<'JS'
          const key=process.env.API_KEY;
          const email=`chatgpt-smoke-${Date.now()}-${Math.random().toString(36).slice(2)}@god-ruin.game`;
          const password='SmokeTest123!';
          async function call(method,body){
            const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:${method}?key=${encodeURIComponent(key)}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
            const d=await r.json();
            if(!r.ok) throw new Error(method+': '+JSON.stringify(d));
            return d;
          }
          let signup=null;
          try{
            signup=await call('signUp',{email,password,returnSecureToken:true});
            const login=await call('signInWithPassword',{email,password,returnSecureToken:true});
            if(!signup.localId||signup.localId!==login.localId) throw new Error('UID mismatch');
            await call('delete',{idToken:login.idToken});
            console.log('FIREBASE_AUTH_SMOKE_PASS');
          }catch(e){
            console.error(String(e));
            if(signup&&signup.idToken){try{await call('delete',{idToken:signup.idToken});}catch(_) {}}
            process.exit(1);
          }
          JS
