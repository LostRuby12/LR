name: Apply core follow-up hardening

on:
  pull_request:
    paths:
      - 'tools/fix_core_followup.py'
      - '.github/workflows/apply-core-followup.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply follow-up fixes
        run: python3 tools/fix_core_followup.py
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          start = s.rfind('<script>')
          end = s.rfind('</script>')
          if start < 0 or end <= start:
              raise SystemExit('inline script not found')
          Path('/tmp/lr-inline.js').write_text(s[start + len('<script>'):end], encoding='utf-8')
          PY
          node --check /tmp/lr-inline.js
      - name: Validate hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          checks = [
            'rtClosingLocally || conn !== rtConn',
            'playerShield = clamp(Number(st.shield) || 0, 0, 300)',
            'enemyShield = clamp(Number(st.shield) || 0, 0, 300)',
            "const safeNick = validateNickname(candidateNick) ? '상대' : candidateNick",
            'async function openPlayMenu()',
          ]
          missing = [x for x in checks if x not in s]
          if missing:
              raise SystemExit('missing: ' + ' | '.join(missing))
          print('follow-up checks passed')
          PY
      - name: Commit updated game
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Harden realtime close and state validation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
