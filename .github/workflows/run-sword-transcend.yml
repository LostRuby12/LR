name: Run sword transcend implementation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-sword-transcend.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Load patch from staging branch
        shell: bash
        run: |
          git fetch origin feat/sword-transcend-11-20-20260822
          git show origin/feat/sword-transcend-11-20-20260822:.github/workflows/sword-transcend-impl.yml > /tmp/source.yml
          python - <<'PY'
          from pathlib import Path
          import textwrap
          s=Path('/tmp/source.yml').read_text(encoding='utf-8')
          start='      - name: Patch index.html\n        shell: python\n        run: |\n'
          end='\n      - name: JavaScript syntax check'
          if start not in s or end not in s:
              raise SystemExit('patch block not found')
          block=s.split(start,1)[1].split(end,1)[0]
          block=textwrap.dedent(block)
          Path('/tmp/sword_patch.py').write_text(block,encoding='utf-8')
          print('patch script chars',len(block))
          PY

      - name: Apply patch
        run: python /tmp/sword_patch.py

      - name: JavaScript syntax check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          inline='\n'.join(x for x in scripts if x.strip())
          Path('/tmp/check.js').write_text(inline,encoding='utf-8')
          print('inline script chars',len(inline))
          PY
          node --check /tmp/check.js
          grep -q "name: '천명의 신검', atk: 85" index.html
          grep -q "name: '살신명도·종언', atk: 500" index.html
          grep -q "async function beginSwordTranscendTurn" index.html
          grep -q "function trySwordTranscendSurvival" index.html

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Implement sword +11 to +20 transcend skills"
          git push origin HEAD:main
