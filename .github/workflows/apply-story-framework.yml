name: Apply main story framework

on:
  push:
    branches: [main]
    paths:
      - '.github/story_framework_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply story framework patch
        run: python .github/story_framework_patch.py
      - name: Syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:[^>]*)>(.*?)</script>', s, flags=re.S)
          Path('/tmp/lr.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/lr.js
      - name: Commit framework and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .github/story_framework_patch.py || true
          git rm -f .github/workflows/apply-story-framework.yml || true
          git rm -f .github/workflows/story-framework-merge-runner.yml || true
          git rm -f .github/workflows/build-main-story-framework.yml || true
          git rm -f .story-framework-merge-trigger || true
          git rm -f .story-framework-runner-note || true
          git commit -m "Build main story chapter framework"
          git push
