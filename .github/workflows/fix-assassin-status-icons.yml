name: Fix assassin status icons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-assassin-status-icons.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix status icon declaration order
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old1 = "function updateStatusIcons() {\n  const pIcons = [];"
          new1 = "function updateStatusIcons() {\n  const pIcons = [];\n  const eIcons = [];"
          old2 = "  const eIcons = [];\n  if (enemyParalyzed) eIcons.push('💫마비');"
          new2 = "  if (enemyParalyzed) eIcons.push('💫마비');"
          if s.count(old1) != 1:
              raise SystemExit(f'expected one updateStatusIcons header, found {s.count(old1)}')
          if s.count(old2) != 1:
              raise SystemExit(f'expected one later eIcons declaration, found {s.count(old2)}')
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>', s, flags=re.S)
          Path('/tmp/lr.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/lr.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix assassin bleed status icon crash"
          git push
