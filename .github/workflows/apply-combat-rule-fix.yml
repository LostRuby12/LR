name: Apply combat rule fixes

on:
  push:
    branches:
      - fix/immortality-mandate-slash-20260822-final

permissions:
  contents: write

jobs:
  patch-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/immortality-mandate-slash-20260822-final
      - name: Apply patch
        run: python .github/fix_rules.py
      - name: Extract JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, re.S|re.I)
          inline=[b for b in blocks if b.strip() and 'firebasejs' not in b]
          Path('/tmp/game.js').write_text('\n'.join(inline),encoding='utf-8')
          print('js bytes', Path('/tmp/game.js').stat().st_size)
          PY
      - name: JavaScript syntax check
        run: node --check /tmp/game.js
      - name: Combat rule assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            "playerTurnCount === 8 && !sword11DamageBuff",
            "playerTurnCount === 16 && !sword11ShieldGranted",
            "playerTurnCount === 24 && !sword11DestinyUsed",
            "unlockTurn: 5",
            "unlockTurn: 10",
            "봉인(즉사)",
            "playerHasImmortality()",
            "applyBossUndying('천명')",
            "applyBossUndying('흑악신멸')",
            "일반 즉사계열→1피해",
          ]
          missing=[x for x in checks if x not in s]
          if missing: raise SystemExit('missing: '+repr(missing))
          if '즉사→최대HP40%피해' in s: raise SystemExit('old Raast immortality rule remains')
          print('combat assertions OK')
          PY
      - name: Diff check
        run: git diff --check
      - name: Commit patched game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix immortality, mandate turns, and slash skill"
          git push origin HEAD:fix/immortality-mandate-slash-20260822-final
