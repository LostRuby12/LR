name: Apply core bug fixes

on:
  pull_request:
    paths:
      - 'tools/fix_core_bugs.py'
      - '.github/workflows/apply-core-bug-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply fixes
        run: python3 tools/fix_core_bugs.py
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          start = s.rfind('<script>')
          end = s.rfind('</script>')
          if start < 0 or end <= start:
              raise SystemExit('inline script not found')
          Path('/tmp/lr-inline.js').write_text(s[start + len('<script>'):end], encoding='utf-8')
          PY
          node --check /tmp/lr-inline.js
      - name: Validate core fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          checks = {
            'realtime snapshot': 'myState: rtSnapshotPlayerState()',
            'safe pvp build': 'rtOppBuild = rtNormalizeBuild(data)',
            'pvp max +10': '결투방에서는 최대 +10 강화까지만 사용할 수 있습니다.',
            'random first turn': 'const hostFirst = rand() < 0.5',
            'normal disconnect neutral': '상대 연결 종료 · 일반전 무효',
            'server daily date': "return trustedAttendanceToday || (saveData.missions && saveData.missions.day) || '';",
            'badge mapping': "playerClass === 'mage' ? 'st' : ''",
            'transcend rate display': 'const maxEnhanceLevel = getEnhanceMaxLevel();',
            'actual player lifesteal': 'abilityW.lifesteal && dealt > 0',
            'actual enemy lifesteal': 'abilityW.lifesteal && actual > 0',
            'duel-only realtime box': "box.style.display = (duelFlow || inRoom) ? 'block' : 'none'",
          }
          missing = [name for name, needle in checks.items() if needle not in s]
          if missing:
              raise SystemExit('missing checks: ' + ', '.join(missing))
          print('all core fix checks passed')
          PY
      - name: Commit updated game
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix realtime, daily missions, and combat state bugs'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
