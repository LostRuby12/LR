name: Apply weapon names and WELCOME coupon

on:
  pull_request:
    paths:
      - 'tools/apply-weapon-names.py'
      - '.github/workflows/apply-weapon-names.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python tools/apply-weapon-names.py
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S|re.I)
          inline = [b for b in blocks if b.strip()]
          if not inline:
              raise SystemExit('no inline script found')
          Path('/tmp/game.js').write_text('\n'.join(inline), encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Verify requested changes
        run: |
          ! grep -q '9c708286ba5458be8adda01ac28b33331ed6aeaac4e5c10897a0e7b7e17956dd' index.html
          grep -q '280d44ab1e9f79b5cce2dd4f58f5fe91f0fbacdac9f7447dffc318ceb79f2d02' index.html
          grep -q '신의 운명' index.html
          grep -q '살신명도' index.html
          grep -q '고대의 전설' index.html
          grep -q '천지창조' index.html
      - name: Commit updated game
        run: |
          git config user.name 'LostRuby12'
          git config user.email 'zikeme06188@gmail.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Set +11 to +20 weapon names and keep only WELCOME'
            git push origin HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}
          fi
