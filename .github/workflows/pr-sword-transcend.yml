name: PR sword transcend patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sword-transcend-11-20-20260822
          fetch-depth: 0
      - name: Extract patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          s=Path('.github/workflows/sword-transcend-impl.yml').read_text(encoding='utf-8')
          start='      - name: Patch index.html\n        shell: python\n        run: |\n'
          end='\n      - name: JavaScript syntax check'
          block=s.split(start,1)[1].split(end,1)[0]
          Path('/tmp/sword_patch.py').write_text(textwrap.dedent(block),encoding='utf-8')
          PY
          python /tmp/sword_patch.py
      - name: Validate JS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          inline='\n'.join(x for x in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S) if x.strip())
          Path('/tmp/check.js').write_text(inline,encoding='utf-8')
          PY
          node --check /tmp/check.js
          grep -q "name: '천명의 신검', atk: 85" index.html
          grep -q "name: '살신명도·종언', atk: 500" index.html
      - name: Commit patched index
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Implement sword +11 to +20 transcend skills"
          git push origin HEAD:feat/sword-transcend-11-20-20260822
