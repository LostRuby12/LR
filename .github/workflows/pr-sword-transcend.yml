name: PR sword transcend patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sword-transcend-11-20-20260822
          fetch-depth: 0

      - name: Apply robust patch
        shell: bash
        run: |
          if grep -q "const SWORD_TRANSCEND_WEAPONS = Object.freeze" index.html; then
            echo "Sword transcend patch already applied"
          else
            python .github/sword_patch_v2.py
          fi

      - name: Validate JavaScript and mechanics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          inline='\n'.join(x for x in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S) if x.strip())
          Path('/tmp/check.js').write_text(inline,encoding='utf-8')
          print('inline JS chars', len(inline))
          PY
          node --check /tmp/check.js
          grep -q "name: '천명의 신검', atk: 85" index.html
          grep -q "name: '참살쇄도', atk: 105" index.html
          grep -q "name: '안슐루스', atk: 130" index.html
          grep -q "name: '신살흑도', atk: 145" index.html
          grep -q "name: '적월도', atk: 180" index.html
          grep -q "name: '명월도', atk: 200" index.html
          grep -q "name: '마검 데스티니', atk: 225" index.html
          grep -q "name: '진·엑스칼리버', atk: 300, instant: 0.65" index.html
          grep -q "name: '불멸의 무라마사', atk: 420" index.html
          grep -q "name: '살신명도·종언', atk: 500" index.html
          grep -q "Math.floor(enemy.hp \* 0.02)" index.html
          grep -q "dmgEnemy(10000)" index.html
          grep -q "async function beginSwordTranscendTurn" index.html
          grep -q "function trySwordTranscendSurvival" index.html

      - name: Commit patched index
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index change to commit"
            exit 0
          fi
          git commit -m "Implement sword +11 to +20 transcend skills"
          git push origin HEAD:feat/sword-transcend-11-20-20260822
