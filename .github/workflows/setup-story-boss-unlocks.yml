name: Apply Story Boss Unlocks

on:
  push:
    branches: [main]
    paths:
      - '.github/patch_story_boss_20260823.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch story boss unlocks
        run: python .github/patch_story_boss_20260823.py
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          scripts=[]
          for m in re.finditer(r'<script([^>]*)>(.*?)</script>', s, re.S|re.I):
              if 'src=' not in m.group(1).lower(): scripts.append(m.group(2))
          Path('/tmp/lr-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          print('inline scripts:', len(scripts))
          PY
          node --check /tmp/lr-inline.js
      - name: Commit production patch and cleanup temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/patch_story_boss_20260823.py .github/workflows/setup-story-boss-unlocks.yml
          for f in .github/story-boss-trigger.txt .github/story-boss-merge-trigger.txt; do
            if [ -f "$f" ]; then git rm "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Gate raid bosses behind story chapters"
          git push
