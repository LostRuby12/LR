name: Setup story boss unlocks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Add story progress and boss unlock gates
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'const STORY_CHAPTER_META = Object.freeze({' in s:
              raise SystemExit(0)

          old = "    raidChance50Unlocked: false,\n    shop: { goldNick: false, assassin: false, priest: false, archer: false },"
          new = "    raidChance50Unlocked: false,\n    story: {\n      stages: { earth1: 0, delta1: 0, ancient1: 0, future1: 0, earth2: 0, demon1: 0, heaven1: 0, space1: 0, void: 0 },\n      clearedChapters: {}\n    },\n    shop: { goldNick: false, assassin: false, priest: false, archer: false },"
          if s.count(old) != 1:
              raise SystemExit(f'default save anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          marker = "// ========== 이벤트 ==========\nfunction openRaidBossMode() {"
          block = r'''const STORY_CHAPTER_META = Object.freeze({
  earth1:   Object.freeze({ name: '지구 1', stages: 5 }),
  delta1:   Object.freeze({ name: '델타 1', stages: 7 }),
  ancient1: Object.freeze({ name: '고대 1', stages: 8 }),
  future1:  Object.freeze({ name: '미래 1', stages: 8 }),
  earth2:   Object.freeze({ name: '지구 2', stages: 8 }),
  demon1:   Object.freeze({ name: '마계 1', stages: 8 }),
  heaven1:  Object.freeze({ name: '천계 1', stages: 9 }),
  space1:   Object.freeze({ name: '우주 1', stages: 10 }),
  void:     Object.freeze({ name: '공허', stages: 10 })
});

function ensureStoryProgress() {
  if (!saveData.story || typeof saveData.story !== 'object') saveData.story = {};
  if (!saveData.story.stages || typeof saveData.story.stages !== 'object') saveData.story.stages = {};
  if (!saveData.story.clearedChapters || typeof saveData.story.clearedChapters !== 'object') saveData.story.clearedChapters = {};
  Object.keys(STORY_CHAPTER_META).forEach(id => {
    const meta = STORY_CHAPTER_META[id];
    const cleared = Math.max(0, Math.min(meta.stages, Math.floor(Number(saveData.story.stages[id]) || 0)));
    saveData.story.stages[id] = cleared;
    if (cleared >= meta.stages) saveData.story.clearedChapters[id] = true;
  });
  return saveData.story;
}

function storyChapterCleared(id) {
  const story = ensureStoryProgress();
  const meta = STORY_CHAPTER_META[id];
  if (!meta) return false;
  return !!story.clearedChapters[id] || Number(story.stages[id] || 0) >= meta.stages;
}

function raidBossUnlocked(id) {
  if (id === 'ancient_mage') return storyChapterCleared('ancient1');
  if (id === 'fallen_god') return storyChapterCleared('demon1');
  return false;
}

function raidBossUnlockText(id) {
  if (id === 'ancient_mage') return '고대 1 클리어 시 해금';
  if (id === 'fallen_god') return '마계 1 클리어 시 해금';
  return '스토리 진행 필요';
}

function refreshRaidBossLocks() {
  ensureStoryProgress();
  const rows = [
    ['ancient_mage', 'raid-boss-mage', '마법사로 도전 시<br>최대 강화 +20'],
    ['fallen_god', 'raid-boss-god', '검사로 도전 시<br>최대 강화 +20']
  ];
  rows.forEach(([id, elId, openDesc]) => {
    const el = $(elId);
    if (!el) return;
    const unlocked = raidBossUnlocked(id);
    el.style.opacity = unlocked ? '1' : '0.42';
    el.style.filter = unlocked ? '' : 'grayscale(0.85)';
    el.style.cursor = unlocked ? 'pointer' : 'not-allowed';
    el.setAttribute('aria-disabled', unlocked ? 'false' : 'true');
    const desc = el.querySelector('.class-desc');
    if (desc) desc.innerHTML = unlocked ? openDesc : `🔒 ${raidBossUnlockText(id)}`;
  });
}

// ========== 이벤트 ==========
function openRaidBossMode() {'''
          if s.count(marker) != 1:
              raise SystemExit(f'raid mode marker count={s.count(marker)}')
          s = s.replace(marker, block, 1)

          old = "  selectedRaidBossId = null;\n  pendingRaidBoss = false;\n  document.querySelectorAll('#raid-boss-mage, #raid-boss-god').forEach(c => c.classList.remove('selected'));"
          new = "  ensureStoryProgress();\n  selectedRaidBossId = null;\n  pendingRaidBoss = false;\n  document.querySelectorAll('#raid-boss-mage, #raid-boss-god').forEach(c => c.classList.remove('selected'));"
          if s.count(old) != 1:
              raise SystemExit(f'open raid reset anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = "  const btn = $('raid-start-btn');\n  if (btn) btn.disabled = true;\n  showScreen('raid-pick-screen');\n}\nfunction selectRaidBoss(id) {\n  if (!RAID_BOSSES[id]) return;"
          new = "  const btn = $('raid-start-btn');\n  if (btn) btn.disabled = true;\n  refreshRaidBossLocks();\n  showScreen('raid-pick-screen');\n}\nfunction selectRaidBoss(id) {\n  if (!RAID_BOSSES[id]) return;\n  if (!raidBossUnlocked(id)) {\n    alert(`🔒 ${RAID_BOSSES[id].name} 도전은 ${raidBossUnlockText(id)}됩니다.`);\n    return;\n  }"
          if s.count(old) != 1:
              raise SystemExit(f'select raid anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = "function confirmRaidBoss() {\n  if (!selectedRaidBossId || !RAID_BOSSES[selectedRaidBossId]) {\n    alert('보스를 선택하세요!');\n    return;\n  }"
          new = "function confirmRaidBoss() {\n  if (!selectedRaidBossId || !RAID_BOSSES[selectedRaidBossId]) {\n    alert('보스를 선택하세요!');\n    return;\n  }\n  if (!raidBossUnlocked(selectedRaidBossId)) {\n    alert(`🔒 ${RAID_BOSSES[selectedRaidBossId].name} 도전은 ${raidBossUnlockText(selectedRaidBossId)}됩니다.`);\n    selectedRaidBossId = null;\n    refreshRaidBossLocks();\n    const btn = $('raid-start-btn');\n    if (btn) btn.disabled = true;\n    return;\n  }"
          if s.count(old) != 1:
              raise SystemExit(f'confirm raid anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:[^>]*)>(.*?)</script>', s, flags=re.S)
          Path('/tmp/lr.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/lr.js
      - name: Commit patch to PR branch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Gate raid bosses behind story chapters"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
