name: Apply requested UI cleanup

on:
  push:
    paths:
      - '.github/workflows/ui-cleanup-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply UI cleanup
        run: python3 tools/ui_cleanup_once.py

      - name: Verify requested changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')

          required = [
              '제작자: Lost Ruby',
              'grid-template-columns:repeat(2,minmax(0,1fr))',
              '📖 효과 · 능력 설명',
              '🟢 방 만들기 (실시간)',
              '🔵 방 참가 (실시간)',
          ]
          forbidden = [
              'Firebase 서버 계정',
              '이메일 입력 없이 닉네임 + 비밀번호로 이용합니다.',
              '오프라인 연습용 코드 결투',
              '코드 결투 만들기',
              '코드 결투 수락',
              'id="challenge-accept-screen"',
              'id="challenge-create-screen"',
              'id="btn-make-challenge"',
              'function startChallengeCreate()',
              'function finishChallengeCreate()',
              'function parseChallengeCode()',
              'function acceptChallengeAndPlay()',
          ]
          missing = [x for x in required if x not in s]
          leftovers = [x for x in forbidden if x in s]
          if missing:
              raise SystemExit('missing requested content: ' + repr(missing))
          if leftovers:
              raise SystemExit('offline/old content still present: ' + repr(leftovers))

          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S | re.I)
          inline = '\n'.join(x for x in scripts if x.strip())
          Path('/tmp/game-inline.js').write_text(inline, encoding='utf-8')
          print('requested UI checks passed')
          PY

          node --check /tmp/game-inline.js

      - name: Commit game update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Polish menus and remove offline code duel'
          git push
