name: Apply mage transcend 11-20
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mage-transcend-11-20
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply mage transcend patch
        run: python tools/patch_mage_transcend.py
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s)
          inline=[b for b in blocks if b.strip()]
          Path('/tmp/game.js').write_text(inline[-1],encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Validate mage transcend implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks={
            'skill button':'id="mage-skill-btn"',
            'mage20 popup':'id="mage20-choice-popup"',
            '11 damage':'11: Object.freeze({ name: \'고대의 전설\', atk: 65',
            '12 damage':'12: Object.freeze({ name: \'신 전설의 시작\', atk: 75',
            '13 damage':'13: Object.freeze({ name: \'파멸의 징조\', atk: 110',
            '14 damage':'14: Object.freeze({ name: \'파멸의 노래\', atk: 35',
            '15 damage':'15: Object.freeze({ name: \'공허균열의 지팡이\', atk: 140',
            '16 damage':'16: Object.freeze({ name: \'만물의 혼돈\', atk: 175',
            '17 damage':'17: Object.freeze({ name: \'만물의 근절\', atk: 195',
            '18 damage':'18: Object.freeze({ name: \'만물의 근원\', atk: 220',
            '19 damage':'19: Object.freeze({ name: \'무한회귀의 지팡이\', atk: 250',
            '20 damage':'20: Object.freeze({ name: \'천지창조\', atk: 500',
            'rift bypass':'bypassShield: riftThisTurn',
            'life spring immunity':'mage18NormalImmuneEnemyTurns = 2',
            'checkpoint revive':'tryMage19CheckpointRevive',
            'annihilation':'만물의 소멸',
            'creation editor':'applyMage20Creation',
          }
          missing=[k for k,v in checks.items() if v not in s]
          if missing: raise SystemExit('missing: '+', '.join(missing))
          if 'lv > 10 && (cls === \'sword\' || cls === \'mage\')' in s:
            raise SystemExit('old shared overcap logic still present')
          print('all mage transcend checks passed')
          PY
      - name: Commit updated game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index changes to commit"
          else
            git commit -m "Implement mage transcend weapons and active skills"
            git push origin HEAD:mage-transcend-11-20
          fi
