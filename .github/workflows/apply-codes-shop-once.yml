name: Apply code tab and shop exchanges

on:
  push:
    paths:
      - 'tools/add_codes_shop_once.py'
      - '.github/workflows/apply-codes-shop-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 tools/add_codes_shop_once.py
      - name: Syntax check inline JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S|re.I)
          inline = [b for b in blocks if b.strip()]
          Path('/tmp/lr-inline.js').write_text('\n'.join(inline), encoding='utf-8')
          PY
          node --check /tmp/lr-inline.js
      - name: Validate requested features
        shell: bash
        run: |
          grep -q "id=\"code-screen\"" index.html
          grep -q "godruin" index.html
          grep -q "lostruby" index.html
          grep -q "lr_to_lp_1000" index.html
          grep -q "lr_to_lp_10000" index.html
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Add code redemption and larger LR to LP exchanges'
            git push
          fi
