name: Assemble uploaded index

on:
  push:
    paths:
      - '.github/workflows/assemble-index.yml'
      - '.tmp-index-upload/**'

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild index.html exactly
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp-index-upload/part00 .tmp-index-upload/part01 .tmp-index-upload/part02 .tmp-index-upload/part03 .tmp-index-upload/part04 .tmp-index-upload/part05 .tmp-index-upload/part06 \
            | base64 --decode \
            | gzip --decompress > index.html
          echo 'a64c607696cfff592d300088d085eea2e820f2b717e504b7a9411b3bafb00ee7  index.html' | sha256sum -c -

      - name: Commit replacement and remove staging parts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-index-upload
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A index.html .tmp-index-upload
          git commit -m 'Replace index.html with uploaded version'
          git push
