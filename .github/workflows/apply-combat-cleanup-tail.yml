name: Apply final combat cleanup

on:
  push:
    branches:
      - fix/combat-cleanup-20260822

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/combat-cleanup-20260822
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final patch and syntax check
        run: python .github/patch_combat_cleanup_tail.py
      - name: Commit patched index
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Finish reflection and purification cleanup"
          git push
