name: Fix correct Firebase key

on:
  push:
    paths:
      - '.github/workflows/fix-correct-firebase-key.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace incorrect Firebase API key
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'AIzaSyDfzGyYq6XoGh0LnZzhfDyHjiHi-gXD7Qk'
          new = 'AIzaSyDfzGyYq6XoGhOLnZzhfDyHjiHi-gXD7Qk'
          if old not in s:
              raise SystemExit('incorrect key not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify key and JavaScript syntax
        shell: bash
        run: |
          grep -F "AIzaSyDfzGyYq6XoGhOLnZzhfDyHjiHi-gXD7Qk" index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)
          Path('/tmp/game.js').write_text('\n'.join(x for x in blocks if x.strip()),encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use correct Firebase API key'
          git push
