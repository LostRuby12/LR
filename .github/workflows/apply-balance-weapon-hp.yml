name: Apply weapon and HP balance

on:
  pull_request:
    paths:
      - 'tools/apply_balance_weapon_hp.py'
      - '.github/workflows/apply-balance-weapon-hp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply balance patch
        run: python tools/apply_balance_weapon_hp.py
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S|re.I)
          inline = [b for b in blocks if b.strip()]
          if not inline:
              raise SystemExit('no inline script found')
          Path('/tmp/game.js').write_text('\n'.join(inline), encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Validate balance values
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          checks = [
            '{ name: "목검", atk: 10, desc: "" }',
            '{ name: "나무 지팡이", atk: 10, seal: 0.02',
            '{ name: "철검", atk: 20, awakenChance: 0.04',
            '{ name: "화검", atk: 25, fire: true',
            '{ name: "백사의 침", atk: 35, extra: 20',
            '{ name: "공허의 대검", atk: 15, corrupt: true',
            '{ name: "몰락한 신의 검", atk: 45, absorb: 0.05',
            '{ name: "신의 유산", atk: 65, revive: true',
            'base + level * 100',
            'enemyBase + (enemyLevel * 100)',
          ]
          for c in checks:
              if c not in s:
                  raise SystemExit('missing: ' + c)
          if 'base + level * 50' in s or 'enemyLevel * 50' in s:
              raise SystemExit('old HP scaling remains')
          PY
      - name: Commit updated game
        run: |
          git config user.name 'LostRuby12'
          git config user.email 'zikeme06188@gmail.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Rebalance sword damage and HP scaling'
            git push origin HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}
          fi
