name: Fix Firebase API key once

on:
  push:
    paths:
      - '.github/workflows/fix-firebase-key-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Firebase API key typo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'AIzaSyDfzGyYq6XoGhOLnZzhfDyHjiHi-gXD7Qk'
          new = 'AIzaSyDfzGyYq6XoGh0LnZzhfDyHjiHi-gXD7Qk'
          if old not in s:
              raise SystemExit('old key not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix Firebase API key typo'
          git push
