name: Apply reward and boss patches

on:
  push:
    paths:
      - '.github/workflows/apply-reward-boss-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply frontend patches
        run: |
          python3 tools/patch_reward_ui.py
          python3 tools/patch_boss_progression.py
      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S|re.I)
          Path('/tmp/inline.js').write_text('\n'.join(b for b in blocks if b.strip()), encoding='utf-8')
          PY
          node --check /tmp/inline.js
          node --check functions/index.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Secure rewards and expand boss progression'
          git push
