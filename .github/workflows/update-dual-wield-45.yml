name: Update dual wield rate to 45

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-dual-wield-45.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dual wield rate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '{ name: "이도류", atk: 77, double: 0.30, fateSealSkill: true, desc: "이중 공격 30% · 자신의 5번째 턴부터 운명봉인 1회(150 피해 + 봉인30%)" }'
          new = '{ name: "이도류", atk: 77, double: 0.45, fateSealSkill: true, desc: "이중 공격 45% · 자신의 5번째 턴부터 운명봉인 1회(150 피해 + 봉인30%)" }'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly 1 target, found {count}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Set dual-wield double attack to 45%"
          git push
