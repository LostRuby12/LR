<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Lost Ruby</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a1a2e}
#game{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#1a1a2e}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1a1a2e;color:#ffd700;font:700 16px system-ui,sans-serif;z-index:2}
</style>
</head>
<body>
<div id="loading">Lost Ruby 로딩 중…</div>
<iframe id="game" title="Lost Ruby" src="app.html?v=earth1-20260827"></iframe>
<script>
(() => {
  const frame = document.getElementById('game');
  const loading = document.getElementById('loading');
  frame.addEventListener('load', () => {
    try {
      const d = frame.contentDocument;
      if (!d || d.getElementById('earth1-production-loader')) return;
      const s = d.createElement('script');
      s.id = 'earth1-production-loader';
      s.src = 'earth1.js?v=earth1-20260827';
      s.onload = () => { loading.style.display = 'none'; };
      s.onerror = () => { loading.textContent = '게임 모듈을 불러오지 못했습니다.'; };
      (d.body || d.documentElement).appendChild(s);
    } catch (e) {
      loading.textContent = '게임을 불러오지 못했습니다.';
      console.error(e);
    }
  });
})();
</script>
</body>
</html>
