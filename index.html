<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Lost Ruby</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#1a1a2e;color:#ffd700}
body{display:flex;align-items:center;justify-content:center;font:700 16px system-ui,sans-serif}
</style>
</head>
<body>
<div id="loading">Lost Ruby 로딩 중…</div>
<script>
(async () => {
  try {
    const res = await fetch('app.html?v=settings-20260830', { cache: 'no-store' });
    if (!res.ok) throw new Error('app.html ' + res.status);
    let html = await res.text();
    const loader = '<script src="earth1.js?v=settings-20260830"><' + '/script>' +
                   '<script src="delta1.js?v=settings-20260830"><' + '/script>' +
                   '<script src="ancient1.js?v=settings-20260830"><' + '/script>' +
                   '<script src="story_ui_patch.js?v=settings-20260830"><' + '/script>' +
                   '<script src="ancient_bgm.js?v=settings-20260830"><' + '/script>' +
                   '<script src="settings_ui.js?v=settings-20260830"><' + '/script>';
    if (/<\/body>/i.test(html)) html = html.replace(/<\/body>/i, loader + '</body>');
    else html += loader;
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.getElementById('loading').textContent = '게임을 불러오지 못했습니다.';
    console.error(e);
  }
})();
</script>
</body>
</html>
